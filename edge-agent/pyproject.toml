[project]
name = "virex-edge-agent"
version = "0.1.0"
description = "Edge side daemon: heartbeat + portal config-pull + docker reconcile."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Loading Cloud" }]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2",
    "structlog>=24",
    "tenacity>=8",
    "nvidia-ml-py>=7",
    "psutil>=5.9",
    "jinja2>=3.1",
    "pyyaml>=6",
    "python-dotenv>=1",
    # Hot-reload: inotify on workers.yaml.
    "watchdog>=6",
    # Used by reconcile.restart_mediamtx() to call Docker SDK.
    "docker>=7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools]
packages = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
