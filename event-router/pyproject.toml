[project]
name = "virex-event-router"
version = "0.1.0"
description = "MQTT → DB → webhook fan-out for Virex detection events."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Loading Cloud" }]

dependencies = [
    "paho-mqtt>=2",
    "redis>=5",
    "sqlalchemy>=2",
    "asyncpg>=0.29",
    "pydantic>=2.5",
    "structlog>=24",
    "httpx>=0.27",
    "tenacity>=8",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "fakeredis>=2",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]