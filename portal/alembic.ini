# SPDX-License-Identifier: Apache-2.0
# Alembic configuration for the Virex portal.
#
# Usage:
#   alembic upgrade head     # apply migrations
#   alembic downgrade -1     # roll back one migration
#   alembic revision --autogenerate -m "..."  # generate next migration
#
# The DATABASE_URL is read from VIREX_DATABASE_URL at runtime via
# portal/migrations/env.py — do NOT hard-code credentials here.

[alembic]
# Path to the migration scripts directory (relative to this file).
# `portal/alembic.ini` is shipped at the portal build root, so the
# migrations dir is just `migrations` here.
script_location = migrations

# Template used to generate migration files.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Timezone for `create_date` — keep UTC so generated migrations are
# reproducible across dev/CI/prod regardless of host clock.
timezone = UTC

# Max identifier length (Postgres default = 63).
truncate_slug_length = 40

# `sqlalchemy.url` is set programmatically in env.py from
# VIREX_DATABASE_URL — we leave it blank here to avoid leaking creds.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S