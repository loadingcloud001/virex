[project]
name = "virex-portal"
version = "0.1.0"
description = "Virex control plane: multi-tenant FastAPI portal."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Loading Cloud" }]

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2",
    "asyncpg>=0.29",
    "pydantic>=2.5",
    "pydantic-settings>=2",
    "structlog>=24",
    "httpx>=0.27",
    "alembic>=1.13",
    "python-dotenv>=1",
    "passlib[bcrypt]>=1.7",
    "pyjwt>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "aiosqlite>=0.20",
]

[tool.setuptools]
packages = [
    "core",
    "api",
    "api.v1",
    "api.v1.endpoints",
    "models",
    "schemas",
    "services",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]